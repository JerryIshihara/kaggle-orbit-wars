<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Orbit Wars Dashboard</title>
<style>
  :root {
    --bg: #0b0d17;
    --panel: #141826;
    --panel-2: #1c2135;
    --border: #252b3d;
    --border-hot: #3b6ef0;
    --text: #e8ecf2;
    --muted: #8b93a8;
    --accent: #3b6ef0;
    --win: #7dd89f;
    --err: #f07b7b;
    --p1: #0072B2;
    --p2: #E69F00;
    --p3: #009E73;
    --p4: #F0E442;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; background: var(--bg); color: var(--text); display: flex; flex-direction: column; overflow: hidden; }
  header { padding: 12px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 20px; flex-shrink: 0; }
  h1 { margin: 0; font-size: 18px; letter-spacing: 0.3px; }
  h2 { margin: 0 0 10px 0; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .tabs { display: flex; gap: 2px; background: var(--panel); padding: 4px; border-radius: 6px; }
  .tab { padding: 6px 16px; cursor: pointer; border-radius: 4px; color: var(--muted); user-select: none; font-size: 14px; }
  .tab.active { background: #2b3350; color: #fff; }

  .layout { display: flex; flex: 1; min-height: 0; }
  aside.sidebar { width: 320px; flex-shrink: 0; border-right: 1px solid var(--border); padding: 16px; background: var(--panel); overflow-y: auto; }
  main { flex: 1; padding: 14px 18px; overflow: auto; min-width: 0; display: flex; flex-direction: column; }
  .pane { display: none; }
  .pane.active { display: flex; flex-direction: column; gap: 10px; min-height: 0; }

  .agent-list { display: flex; flex-direction: column; gap: 6px; }
  .agent-card { padding: 8px 12px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 4px; cursor: grab; user-select: none; transition: all 0.15s; display: flex; flex-direction: column; gap: 3px; }
  .agent-card .aid { font-size: 14px; font-family: ui-monospace, "SF Mono", Menlo, monospace; color: var(--text); }
  .agent-card .adesc { font-size: 11px; color: var(--muted); line-height: 1.35; }
  .agent-card:hover { border-color: var(--accent); background: #232a43; }
  .agent-card:active { cursor: grabbing; }
  .agent-card.dragging { opacity: 0.4; }
  .hint { font-size: 11px; color: var(--muted); line-height: 1.5; margin-top: 12px; }

  .controls-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; flex-shrink: 0; }
  button, .toggle { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 6px 10px; font-size: 13px; font-family: inherit; }
  button { cursor: pointer; background: var(--accent); border-color: var(--accent); font-weight: 600; }
  button:hover:not(:disabled) { filter: brightness(1.15); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.secondary { background: var(--panel); border-color: var(--border); font-weight: 400; color: var(--muted); }
  .toggle { padding: 2px; display: flex; gap: 2px; }
  .toggle button { background: transparent; border: none; padding: 4px 12px; font-weight: 400; color: var(--muted); border-radius: 3px; font-size: 13px; }
  .toggle button.active { background: #2b3350; color: #fff; }

  .slots { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .slot { position: relative; display: flex; align-items: center; gap: 6px; min-width: 130px; height: 32px; padding: 0 10px 0 8px; border: 1.5px dashed var(--border); border-radius: 4px; background: var(--panel); font-size: 13px; transition: border-color 0.15s, background 0.15s; }
  .slot.disabled { opacity: 0.35; pointer-events: none; }
  .slot .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--border); flex-shrink: 0; }
  .slot .pname { font-size: 10px; color: var(--muted); letter-spacing: 0.5px; text-transform: uppercase; width: 22px; flex-shrink: 0; }
  .slot .body { font-family: ui-monospace, "SF Mono", Menlo, monospace; color: var(--muted); font-style: italic; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .slot.filled { border-style: solid; background: var(--panel-2); }
  .slot.filled .body { color: var(--text); font-style: normal; }
  .slot.drag-over { border-color: var(--border-hot); background: #1c2a4a; }
  .slot.filled[data-player="0"] { border-color: var(--p1); }
  .slot.filled[data-player="1"] { border-color: var(--p2); }
  .slot.filled[data-player="2"] { border-color: var(--p3); }
  .slot.filled[data-player="3"] { border-color: var(--p4); }
  .slot[data-player="0"] .dot { background: var(--p1); }
  .slot[data-player="1"] .dot { background: var(--p2); }
  .slot[data-player="2"] .dot { background: var(--p3); }
  .slot[data-player="3"] .dot { background: var(--p4); }
  .slot .clear-btn { background: transparent; border: none; color: var(--muted); cursor: pointer; font-size: 15px; line-height: 1; padding: 0 3px; border-radius: 3px; }
  .slot .clear-btn:hover { color: var(--err); }

  #status { color: var(--muted); font-size: 12px; flex-shrink: 0; }
  #status.error { color: var(--err); }
  #summary { font-size: 13px; color: var(--muted); flex-shrink: 0; }
  #summary .winner { color: var(--win); font-weight: 600; }
  .match-row { display: flex; gap: 12px; flex: 1; min-height: 0; }
  #replay { flex: 1; min-width: 0; height: 100%; border: 1px solid var(--border); border-radius: 4px; background: #000; }

  /* Replay sits at the top of the main pane; charts stack vertically below
     it, each spanning the full width. */
  .match-row { display: flex; flex: 1; min-height: 320px; }
  .charts-col { display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; min-width: 0; }
  .chart-panel { background: var(--panel); border: 1px solid var(--border); border-radius: 4px; padding: 8px; display: flex; flex-direction: column; min-width: 0; height: 220px; }
  .chart-panel .chart-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 4px; flex-shrink: 0; }
  .chart-panel .chart-body { flex: 1; min-height: 0; }
  .chart-panel svg { width: 100%; height: 100%; display: block; }
  .chart-panel .empty { color: var(--muted); font-style: italic; font-size: 12px; padding: 12px; text-align: center; }

  .placeholder { color: var(--muted); font-style: italic; padding: 60px 20px; text-align: center; border: 1px dashed var(--border); border-radius: 6px; }
</style>
</head>
<body>
<header>
  <h1>Orbit Wars</h1>
  <div class="tabs" id="tabs">
    <div class="tab active" data-tab="play">Play</div>
    <div class="tab" data-tab="train">Train</div>
  </div>
</header>
<div class="layout">
  <aside class="sidebar">
    <h2>Agents</h2>
    <div class="agent-list" id="agentList"></div>
    <p class="hint">Drag an agent onto a player slot. An agent can fill multiple slots.</p>
  </aside>
  <main>
    <section class="pane active" id="pane-play">
      <div class="controls-row">
        <div class="toggle" id="nplayers">
          <button data-n="2" class="active">2P</button>
          <button data-n="4">4P</button>
        </div>
        <div class="slots" id="slots"></div>
        <button id="run" disabled>Run Match</button>
        <button id="clear" class="secondary">Clear</button>
        <div class="toggle" id="replaySpeed" title="replay playback speed">
          <button data-key="3">0.5x</button>
          <button data-key="4" class="active">1x</button>
          <button data-key="5">2x</button>
          <button data-key="7">4x</button>
          <button data-key="9">max</button>
        </div>
      </div>
      <div id="status">ready</div>
      <div id="summary"></div>
      <div class="match-row">
        <iframe id="replay" src="about:blank"></iframe>
      </div>
      <div class="charts-col">
        <div class="chart-panel">
          <div class="chart-title">Ships over time</div>
          <div class="chart-body" id="chart"><div class="empty">run a match to see per-step scores</div></div>
        </div>
        <div class="chart-panel">
          <div class="chart-title">Fleet outcomes (waste)</div>
          <div class="chart-body" id="wasteChart"><div class="empty">no data</div></div>
        </div>
        <div class="chart-panel">
          <div class="chart-title">Time-to-target distribution</div>
          <div class="chart-body" id="ttoChart"><div class="empty">no data</div></div>
        </div>
      </div>
    </section>
    <section class="pane" id="pane-train">
      <div class="placeholder">Training mode coming soon.</div>
    </section>
  </main>
</div>
<script>
const agentListEl = document.getElementById('agentList');
const nPlayersToggle = document.getElementById('nplayers');
const slotsEl = document.getElementById('slots');
const runBtn = document.getElementById('run');
const clearBtn = document.getElementById('clear');
const statusEl = document.getElementById('status');
const summaryEl = document.getElementById('summary');
const replayFrame = document.getElementById('replay');
const chartEl = document.getElementById('chart');
const wasteChartEl = document.getElementById('wasteChart');
const ttoChartEl = document.getElementById('ttoChart');
const replaySpeedToggle = document.getElementById('replaySpeed');
let replaySpeedKey = 4;  // index into renderer's speeds[] (default 333 ms/step)

const PLAYER_COLORS = ['#0072B2', '#E69F00', '#009E73', '#F0E442'];

let availableAgents = [];
let slots = [null, null, null, null];
let nPlayers = 2;
let lastMatch = null;
let chartRenderTimer = null;

async function loadAgents() {
  try {
    const r = await fetch('/api/agents');
    const data = await r.json();
    availableAgents = data.agents;
    renderAgentList();
    statusEl.textContent = `ready · ${availableAgents.length} agents registered`;
  } catch (err) {
    statusEl.textContent = 'failed to load agents: ' + err.message;
    statusEl.classList.add('error');
  }
}

function describeAgent(id) {
  const a = availableAgents.find(x => x.id === id);
  return a ? a.description : '';
}

function renderAgentList() {
  agentListEl.innerHTML = '';
  for (const a of availableAgents) {
    const card = document.createElement('div');
    card.className = 'agent-card';
    card.draggable = true;
    card.title = a.description;
    card.dataset.agent = a.id;
    card.innerHTML = `<span class="aid">${a.id}</span><span class="adesc">${a.description}</span>`;
    card.addEventListener('dragstart', e => {
      e.dataTransfer.setData('text/plain', a.id);
      e.dataTransfer.effectAllowed = 'copy';
      card.classList.add('dragging');
    });
    card.addEventListener('dragend', () => card.classList.remove('dragging'));
    agentListEl.appendChild(card);
  }
}

function renderSlots() {
  slotsEl.innerHTML = '';
  for (let i = 0; i < 4; i++) {
    const agent = slots[i];
    const enabled = i < nPlayers;
    const slot = document.createElement('div');
    slot.className = 'slot' + (agent ? ' filled' : '') + (enabled ? '' : ' disabled');
    slot.dataset.index = i;
    slot.dataset.player = i;
    slot.title = agent ? describeAgent(agent) : '';
    slot.innerHTML = `
      <span class="dot"></span>
      <span class="pname">P${i + 1}</span>
      <span class="body">${agent ? agent : 'drop agent'}</span>
      ${agent ? `<button class="clear-btn" title="remove">×</button>` : ''}
    `;
    if (enabled) {
      slot.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; slot.classList.add('drag-over'); });
      slot.addEventListener('dragleave', () => slot.classList.remove('drag-over'));
      slot.addEventListener('drop', e => {
        e.preventDefault();
        slot.classList.remove('drag-over');
        const a = e.dataTransfer.getData('text/plain');
        if (availableAgents.some(x => x.id === a)) {
          slots[i] = a;
          renderSlots();
        }
      });
      const cb = slot.querySelector('.clear-btn');
      if (cb) cb.addEventListener('click', () => { slots[i] = null; renderSlots(); });
    }
    slotsEl.appendChild(slot);
  }
  updateRunButton();
}

function updateRunButton() {
  const filled = slots.slice(0, nPlayers).every(s => s !== null);
  runBtn.disabled = !filled;
}

function setNPlayers(n) {
  nPlayers = n;
  for (const b of nPlayersToggle.querySelectorAll('button')) {
    b.classList.toggle('active', +b.dataset.n === n);
  }
  renderSlots();
}

nPlayersToggle.addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (btn) setNPlayers(+btn.dataset.n);
});

clearBtn.addEventListener('click', () => {
  slots = [null, null, null, null];
  renderSlots();
});

function applyReplaySpeed() {
  try {
    const w = replayFrame.contentWindow;
    if (!w) return;
    w.dispatchEvent(new KeyboardEvent('keydown', {
      keyCode: replaySpeedKey + 48,
      which: replaySpeedKey + 48,
    }));
  } catch (_) {}
}

replaySpeedToggle.addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  replaySpeedKey = +btn.dataset.key;
  for (const b of replaySpeedToggle.querySelectorAll('button')) {
    b.classList.toggle('active', +b.dataset.key === replaySpeedKey);
  }
  applyReplaySpeed();
});

replayFrame.addEventListener('load', () => {
  // The outer player installs its keydown listener in a setTimeout(0).
  setTimeout(applyReplaySpeed, 400);
});

document.getElementById('tabs').addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  for (const t of document.querySelectorAll('.tab')) t.classList.remove('active');
  for (const p of document.querySelectorAll('.pane')) p.classList.remove('active');
  tab.classList.add('active');
  document.getElementById('pane-' + tab.dataset.tab).classList.add('active');
});

function resetMatchUI(agentIds) {
  summaryEl.textContent = '';
  chartEl.innerHTML = '<div class="empty">match running...</div>';
  wasteChartEl.innerHTML = '<div class="empty">waiting for end of match...</div>';
  ttoChartEl.innerHTML = '<div class="empty">waiting for end of match...</div>';
}

function scheduleChartRender(scores, agentIds) {
  if (chartRenderTimer) return;
  chartRenderTimer = requestAnimationFrame(() => {
    chartRenderTimer = null;
    renderChart(scores, agentIds);
  });
}

function renderChart(scores, agentIds) {
  if (!scores || !scores.length) { chartEl.innerHTML = '<div class="empty">no data</div>'; return; }
  const cs = getComputedStyle(chartEl);
  const padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
  const padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
  const W = Math.max(320, chartEl.clientWidth - padX);
  const H = Math.max(120, chartEl.clientHeight - padY);
  const pad = { top: 20, right: 16, bottom: 24, left: 48 };
  const plotW = W - pad.left - pad.right;
  const plotH = H - pad.top - pad.bottom;
  const T = scores.length;
  const N = scores[0].length;
  const maxY = Math.max(1, ...scores.flat());
  const xAt = t => pad.left + (T <= 1 ? 0 : (t / (T - 1)) * plotW);
  const yAt = v => pad.top + plotH - (v / maxY) * plotH;
  const parts = [];

  const yTicks = 4;
  for (let i = 0; i <= yTicks; i++) {
    const v = Math.round((maxY * i) / yTicks);
    const y = yAt(v);
    parts.push(`<line x1="${pad.left}" x2="${W - pad.right}" y1="${y}" y2="${y}" stroke="#252b3d"/>`);
    parts.push(`<text x="${pad.left - 6}" y="${y + 4}" fill="#8b93a8" font-size="11" text-anchor="end">${v}</text>`);
  }
  const xTicks = 5;
  for (let i = 0; i <= xTicks; i++) {
    const t = Math.round(((T - 1) * i) / xTicks);
    const x = xAt(t);
    parts.push(`<text x="${x}" y="${H - 8}" fill="#8b93a8" font-size="11" text-anchor="middle">${t}</text>`);
  }
  parts.push(`<line x1="${pad.left}" x2="${pad.left}" y1="${pad.top}" y2="${H - pad.bottom}" stroke="#3a4157"/>`);
  parts.push(`<line x1="${pad.left}" x2="${W - pad.right}" y1="${H - pad.bottom}" y2="${H - pad.bottom}" stroke="#3a4157"/>`);

  for (let p = 0; p < N; p++) {
    const pts = scores.map((s, t) => `${xAt(t).toFixed(1)},${yAt(s[p]).toFixed(1)}`).join(' ');
    parts.push(`<polyline fill="none" stroke="${PLAYER_COLORS[p]}" stroke-width="1.8" points="${pts}"/>`);
  }

  let lx = pad.left;
  for (let p = 0; p < N; p++) {
    const label = `P${p + 1} ${agentIds[p]}`;
    parts.push(`<circle cx="${lx + 5}" cy="12" r="4" fill="${PLAYER_COLORS[p]}"/>`);
    parts.push(`<text x="${lx + 14}" y="16" fill="#e8ecf2" font-size="12">${label}</text>`);
    lx += Math.max(90, label.length * 7 + 30);
  }

  chartEl.innerHTML = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${parts.join('')}</svg>`;
}

// ---------- Waste chart: stacked horizontal bar per player by outcome ----------
const OUTCOME_COLORS = {
  captured:      '#7dd89f',  // green — useful
  reinforced:    '#56b370',  // green — useful
  annihilated:   '#f07b7b',  // red
  destroyed_sun: '#f0b878',  // orange
  out_of_map:    '#8b6cd8',  // purple
  unknown:       '#5a6378',  // grey
  still_in_flight: '#3a4157', // dark grey
};
const OUTCOME_ORDER = ['captured', 'reinforced', 'annihilated', 'destroyed_sun', 'out_of_map', 'unknown', 'still_in_flight'];

function renderWasteChart(wasteStats, agentIds) {
  if (!wasteStats || Object.keys(wasteStats).length === 0) {
    wasteChartEl.innerHTML = '<div class="empty">no fleet data</div>';
    return;
  }
  const W = Math.max(220, wasteChartEl.clientWidth);
  const H = Math.max(120, wasteChartEl.clientHeight);
  const pad = { top: 8, right: 8, bottom: 32, left: 60 };
  const plotW = W - pad.left - pad.right;
  const plotH = H - pad.top - pad.bottom;
  const players = Object.keys(wasteStats).sort((a, b) => +a - +b);
  const N = players.length;
  if (!N) { wasteChartEl.innerHTML = '<div class="empty">no fleet data</div>'; return; }
  const barH = Math.min(28, plotH / N - 6);
  const parts = [];

  players.forEach((pkey, idx) => {
    const owner = +pkey;
    const d = wasteStats[pkey];
    const total = d.total || 1;
    const y = pad.top + idx * (plotH / N) + (plotH / N - barH) / 2;
    const label = `P${owner + 1} ${agentIds[owner] || ''}`;
    parts.push(`<text x="${pad.left - 6}" y="${y + barH / 2 + 4}" fill="#e8ecf2" font-size="11" text-anchor="end">${label}</text>`);

    let x = pad.left;
    for (const oc of OUTCOME_ORDER) {
      const cnt = (d.by_outcome || {})[oc] || 0;
      if (!cnt) continue;
      const w = (cnt / total) * plotW;
      const color = OUTCOME_COLORS[oc] || '#5a6378';
      parts.push(`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${barH}" fill="${color}"><title>${oc}: ${cnt} (${(100*cnt/total).toFixed(1)}%)</title></rect>`);
      if (w > 30) {
        parts.push(`<text x="${(x + w/2).toFixed(1)}" y="${(y + barH/2 + 4).toFixed(1)}" fill="#0b0d17" font-size="10" text-anchor="middle" font-weight="600">${cnt}</text>`);
      }
      x += w;
    }
    // Waste percentage at right edge
    const pct = (d.waste_ratio * 100).toFixed(0);
    parts.push(`<text x="${(pad.left + plotW + 4).toFixed(1)}" y="${(y + barH/2 + 4).toFixed(1)}" fill="#8b93a8" font-size="11">${pct}%</text>`);
  });

  // Legend at the bottom
  let lx = pad.left;
  const ly = H - 16;
  for (const oc of OUTCOME_ORDER) {
    if (!players.some(pk => (wasteStats[pk].by_outcome || {})[oc])) continue;
    const color = OUTCOME_COLORS[oc] || '#5a6378';
    parts.push(`<rect x="${lx}" y="${ly}" width="10" height="10" fill="${color}"/>`);
    parts.push(`<text x="${lx + 14}" y="${ly + 9}" fill="#8b93a8" font-size="10">${oc}</text>`);
    lx += 14 + (oc.length * 6) + 12;
    if (lx > W - 60) break;
  }

  wasteChartEl.innerHTML = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${parts.join('')}</svg>`;
}

// ---------- Time-to-target histogram per player ----------
function renderTtoChart(records, agentIds) {
  if (!records || !records.length) { ttoChartEl.innerHTML = '<div class="empty">no fleet data</div>'; return; }
  const resolved = records.filter(r => r.outcome !== 'still_in_flight');
  if (!resolved.length) { ttoChartEl.innerHTML = '<div class="empty">no resolved fleets</div>'; return; }

  const W = Math.max(220, ttoChartEl.clientWidth);
  const H = Math.max(120, ttoChartEl.clientHeight);
  const pad = { top: 8, right: 8, bottom: 24, left: 30 };
  const plotW = W - pad.left - pad.right;
  const plotH = H - pad.top - pad.bottom;

  const maxTT = Math.max(5, ...resolved.map(r => r.tt));
  const NUM_BINS = 16;
  const binWidth = Math.max(1, Math.ceil(maxTT / NUM_BINS));
  const players = Array.from(new Set(resolved.map(r => r.owner))).sort((a, b) => a - b);
  const bins = {};  // owner → array of counts
  for (const p of players) bins[p] = new Array(NUM_BINS).fill(0);
  for (const r of resolved) {
    const b = Math.min(NUM_BINS - 1, Math.floor(r.tt / binWidth));
    bins[r.owner][b]++;
  }
  const maxCount = Math.max(1, ...Object.values(bins).flat());
  const parts = [];

  // Y axis (count)
  for (let i = 0; i <= 4; i++) {
    const v = Math.round((maxCount * i) / 4);
    const y = pad.top + plotH - (v / maxCount) * plotH;
    parts.push(`<line x1="${pad.left}" x2="${W - pad.right}" y1="${y}" y2="${y}" stroke="#252b3d"/>`);
    parts.push(`<text x="${pad.left - 4}" y="${y + 4}" fill="#8b93a8" font-size="10" text-anchor="end">${v}</text>`);
  }
  // X axis (tt bins)
  parts.push(`<line x1="${pad.left}" x2="${W - pad.right}" y1="${H - pad.bottom}" y2="${H - pad.bottom}" stroke="#3a4157"/>`);
  for (let i = 0; i <= 4; i++) {
    const tt = Math.round((maxTT * i) / 4);
    const x = pad.left + (i / 4) * plotW;
    parts.push(`<text x="${x}" y="${H - 8}" fill="#8b93a8" font-size="10" text-anchor="middle">${tt}</text>`);
  }

  // Grouped bars: per-bin, side-by-side per player.
  const groupW = plotW / NUM_BINS;
  const subW = (groupW * 0.8) / players.length;
  for (let b = 0; b < NUM_BINS; b++) {
    players.forEach((owner, pi) => {
      const cnt = bins[owner][b];
      if (!cnt) return;
      const h = (cnt / maxCount) * plotH;
      const x = pad.left + b * groupW + (groupW * 0.1) + pi * subW;
      const y = pad.top + plotH - h;
      const color = PLAYER_COLORS[owner];
      const lo = b * binWidth, hi = (b + 1) * binWidth;
      parts.push(`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${Math.max(1, subW - 1).toFixed(1)}" height="${h.toFixed(1)}" fill="${color}"><title>P${owner + 1} tt ${lo}-${hi}: ${cnt}</title></rect>`);
    });
  }

  // Legend with median annotation
  let lx = pad.left;
  for (const owner of players) {
    const tts = resolved.filter(r => r.owner === owner).map(r => r.tt).sort((a, b) => a - b);
    const median = tts.length ? tts[Math.floor(tts.length / 2)] : 0;
    const label = `P${owner + 1} ${agentIds[owner] || ''} (med ${median})`;
    parts.push(`<rect x="${lx}" y="2" width="10" height="10" fill="${PLAYER_COLORS[owner]}"/>`);
    parts.push(`<text x="${lx + 14}" y="11" fill="#e8ecf2" font-size="10">${label}</text>`);
    lx += 14 + label.length * 6 + 14;
  }

  ttoChartEl.innerHTML = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${parts.join('')}</svg>`;
}

runBtn.addEventListener('click', async () => {
  const chosen = slots.slice(0, nPlayers);
  runBtn.disabled = true;
  statusEl.classList.remove('error');
  statusEl.textContent = `running match (${chosen.join(' vs ')})...`;
  resetMatchUI(chosen);
  lastMatch = null;

  try {
    const r = await fetch('/api/play', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ agents: chosen }),
    });
    if (!r.ok) {
      const err = await r.json().catch(() => ({ detail: r.statusText }));
      throw new Error(err.detail || 'request failed');
    }

    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    const streamedScores = [];
    let streamAgents = chosen;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (!line) continue;
        let msg;
        try { msg = JSON.parse(line); } catch { continue; }
        if (msg.type === 'init') {
          streamAgents = msg.agents;
        } else if (msg.type === 'step') {
          streamedScores.push(msg.scores);
          scheduleChartRender(streamedScores, streamAgents);
        } else if (msg.type === 'done') {
          renderChart(streamedScores, streamAgents);
          renderWasteChart(msg.waste_stats, msg.agents);
          renderTtoChart(msg.fleet_records, msg.agents);
          statusEl.textContent = `done · ${msg.run_id}`;
          summaryEl.innerHTML = msg.rewards.map((rw, i) => {
            const label = `P${i + 1} (${msg.agents[i]}): ${rw}`;
            return i === msg.winner ? `<span class="winner">${label} ← winner</span>` : label;
          }).join(' · ');
          replayFrame.src = msg.replay_url;
          lastMatch = {
            scores: streamedScores,
            agents: streamAgents,
            wasteStats: msg.waste_stats,
            fleetRecords: msg.fleet_records,
          };
        }
      }
    }
  } catch (err) {
    statusEl.textContent = 'error: ' + err.message;
    statusEl.classList.add('error');
  } finally {
    updateRunButton();
  }
});

window.addEventListener('resize', () => {
  if (!lastMatch) return;
  renderChart(lastMatch.scores, lastMatch.agents);
  renderWasteChart(lastMatch.wasteStats, lastMatch.agents);
  renderTtoChart(lastMatch.fleetRecords, lastMatch.agents);
});

renderSlots();
loadAgents();
</script>
